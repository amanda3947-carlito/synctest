<style>
/* Layout: one-screen phone app. A slim header, a scrolling stage, and a bottom tab bar.
   The swipe deck is the hero; everything else (survey, results, setup) is utilitarian. */
:root{
  --bg:#FAF6F7; --surface:#FFFFFF; --surface-2:#F2EAEE; --fg:#241B22; --muted:#6E5F69; --line:#E5D9DE;
  --accent:#C8385A; --accent-fg:#FFFFFF; --accent-soft:#F8E1E7;
  --like:#1F8A70; --like-soft:#DDF2EC; --pass:#7A6E78; --pass-soft:#ECE6E9; --warn:#B7791F;
  --shadow:0 12px 32px rgba(70,20,45,.14); --shadow-sm:0 2px 8px rgba(70,20,45,.08);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:20px; --radius-sm:12px;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17121A; --surface:#221A26; --surface-2:#2D2331; --fg:#F4ECF0; --muted:#AA9AA3; --line:#3B2F3E;
  --accent:#E8607E; --accent-fg:#1B0F14; --accent-soft:#3D2130;
  --like:#43C2A0; --like-soft:#1E3A33; --pass:#A3959E; --pass-soft:#352B38; --warn:#E0A64A;
  --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#221A26; --surface-2:#2D2331; --fg:#F4ECF0; --muted:#AA9AA3; --line:#3B2F3E;
  --accent:#E8607E; --accent-fg:#1B0F14; --accent-soft:#3D2130;
  --like:#43C2A0; --like-soft:#1E3A33; --pass:#A3959E; --pass-soft:#352B38; --warn:#E0A64A;
  --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 2px 8px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* App frame */
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--bg)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .name{font-family:var(--display);font-weight:700;font-size:1.05rem}
.brand .sub{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.topbar .right{display:flex;align-items:center;gap:8px}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:8px 24px;-webkit-overflow-scrolling:touch}
.stage.locked{overflow:hidden}
.screen{display:flex;flex-direction:column;gap:16px;min-height:100%}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;font-weight:600;font-size:.95rem;background:var(--surface-2);color:var(--fg);transition:transform .08s ease,background .15s ease;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 14px;min-height:36px;font-size:.85rem}
.btn.block{width:100%}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);min-width:0}
textarea{min-height:90px;resize:vertical}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;min-height:320px;white-space:pre;overflow:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface-2);color:var(--fg)}
.chip.like{background:var(--like-soft);color:var(--like)}
.chip.pass{background:var(--pass-soft);color:var(--pass)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{background:var(--accent-soft);color:var(--fg);border-radius:var(--radius-sm);padding:12px 14px;font-size:.88rem;line-height:1.4}
.notice b{color:var(--accent)}

/* Home */
.hero{padding:18px 4px 4px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:2.3rem;font-weight:700;letter-spacing:-.01em}
.hero .tag{font-size:1.05rem;color:var(--muted);max-width:32ch}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1}
.stat .k{font-size:.72rem;color:var(--muted)}

/* Pitch */
.pitch{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:24px}
.pitch .slide{display:flex;flex-direction:column;gap:14px}
.pitch .slide h2{font-size:2rem;font-weight:700}
.pitch .slide p{font-size:1.05rem;color:var(--muted);max-width:36ch}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}

/* Deck */
.deckwrap{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.deck{position:relative;flex:1;min-height:420px;touch-action:none}
.pcard{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);transform-origin:50% 100%;will-change:transform;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
.pcard.under{transform:scale(.95) translateY(10px);opacity:.85}
.pcard.under2{transform:scale(.9) translateY(20px);opacity:.6}
.pcard.flying{transition:transform .35s cubic-bezier(.2,.7,.3,1),opacity .35s}
.pcard.snap{transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.photo{position:relative;flex:1;min-height:0;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.photo .initial{position:absolute;right:-6%;top:-10%;font-family:var(--display);font-size:min(60vw,320px);font-weight:700;line-height:1;color:rgba(255,255,255,.22);pointer-events:none}
.photo .glow{position:absolute;inset:auto -20% -30% -20%;height:70%;background:radial-gradient(ellipse at center,rgba(255,255,255,.35),transparent 65%);pointer-events:none}
.photo .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,8,14,.78) 100%);pointer-events:none}
.photo .meta{position:relative;padding:16px 18px 18px;color:#fff;display:flex;flex-direction:column;gap:6px;width:100%}
.photo .meta h2{font-size:1.9rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.photo .meta .line{font-size:.9rem;opacity:.9;display:flex;gap:10px;flex-wrap:wrap}
.stamp{position:absolute;top:22px;padding:6px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase;opacity:0;transform:rotate(-14deg);font-family:var(--body)}
.stamp.like{left:18px;color:#3DD3A6;border-color:#3DD3A6}
.stamp.pass{right:18px;color:#FF6B8A;border-color:#FF6B8A;transform:rotate(14deg)}
.pbody{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.prompt{display:flex;flex-direction:column;gap:3px}
.prompt .q{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prompt .a{font-family:var(--display);font-size:1.1rem;font-weight:500;line-height:1.3}
.prompt-first .photo .meta h2{font-size:1.3rem}
.prompt-first .photo .lead{position:relative;padding:22px 20px;color:#fff;display:flex;flex-direction:column;gap:10px;width:100%;margin-top:auto}
.prompt-first .photo .lead .q{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.prompt-first .photo .lead .a{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.2;text-wrap:balance}
.prompt-first .photo.hidden-photo .initial{display:none}
.prompt-first .photo.hidden-photo .shade{background:linear-gradient(180deg,rgba(20,8,14,.15),rgba(20,8,14,.55))}
.reveal{align-self:flex-start;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:600;backdrop-filter:blur(6px)}
.sync{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px}
.sync .pct{font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--accent);min-width:3.2ch;font-variant-numeric:tabular-nums}
.sync .lbl{font-size:.75rem;color:var(--muted);line-height:1.2}
.week{display:flex;gap:3px;margin-left:auto;align-items:flex-end;height:26px}
.week i{width:9px;border-radius:3px;background:var(--line);display:block}
.week i.m{background:var(--accent)}
.week i.h{background:var(--accent);opacity:.45}
.details{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;justify-content:center;align-items:center;gap:18px;padding-block:4px}
.actions button{width:62px;height:62px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:transform .1s}
.actions button:active{transform:scale(.92)}
.actions button svg{width:28px;height:28px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.actions .pass svg{stroke:var(--pass)}
.actions .like svg{stroke:var(--like)}
.actions .info{width:48px;height:48px}
.actions .info svg{width:22px;height:22px;stroke:var(--muted)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Match */
.match{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center;padding-block:20px}
.match h1{font-size:2.6rem;font-weight:700;color:var(--accent)}
.avatars{display:flex;justify-content:center;gap:-10px}
.avatar{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2rem;font-weight:700;color:#fff;border:4px solid var(--bg);box-shadow:var(--shadow-sm)}
.avatar+.avatar{margin-left:-18px}
.opener{text-align:left;display:flex;flex-direction:column;gap:10px}
.opener .suggest{background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:.95rem;line-height:1.4}
.opener .suggest b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}

/* Survey */
.q{display:flex;flex-direction:column;gap:10px}
.q .text{font-weight:600;font-size:1rem}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button,.npsrow button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.likert button[aria-pressed="true"],.npsrow button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.likert .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.npsrow{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.npsrow button{padding:9px 0;font-size:.8rem;border-radius:8px}

/* Results */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.05}
.tile .k{font-size:.75rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 3fr auto;gap:10px;align-items:center;font-size:.85rem}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .fill.like{background:var(--like)}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar .val{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4ch;text-align:right}
.sess{display:flex;flex-direction:column;gap:8px}
.sess summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess .body{display:flex;flex-direction:column;gap:8px;padding-top:10px;font-size:.88rem}
.quote{border-left:3px solid var(--accent-soft);padding-left:10px;color:var(--muted);font-style:italic}
.empty{text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head><!-- pwa-only -->
<body><!-- pwa-only -->
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="name" id="brandName">Sync</span><span class="sub">Concept Lab</span></div>
    <div class="right" id="topRight"></div>
  </header>
  <main class="stage" id="stage"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.2 12C19 16.4 12 21 12 21z"/></svg>Test</button>
    <button data-tab="results"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</button>
    <button data-tab="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setup</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Default concept (placeholder: replace in Setup) ---------- */
const DEFAULT_CONFIG = {
  concept: {
    name: "Sync",
    tagline: "Match on how you actually spend your week.",
    pitch: [
      { title: "Your week is your profile", body: "Instead of a photo grid, Sync builds your profile from the rhythm of your week: when you're free, what you do with it, and who you'd want along." },
      { title: "See the overlap first", body: "Every card opens with a Sync score: how much of your free time lines up with theirs." },
      { title: "Plans, not small talk", body: "Matches start with a concrete plan for a time you're both free, so the first message is a yes or no, not a 'hey'." }
    ]
  },
  variants: [
    { id: "A", label: "Classic swipe", cardStyle: "photo-first", showSyncScore: false, openerStyle: "blank" },
    { id: "B", label: "Sync-first", cardStyle: "prompt-first", showSyncScore: true, openerStyle: "plan" }
  ],
  session: { cardsPerSession: 10, matchChance: 0.4, assignVariant: "alternate" },
  survey: [
    { id: "clear", type: "likert", text: "I understood what makes this app different from the ones I already use." },
    { id: "useful", type: "likert", text: "The information on each card helped me decide quickly." },
    { id: "trust", type: "likert", text: "I'd trust the matches this app suggests." },
    { id: "nps", type: "nps", text: "How likely are you to recommend this to a friend?" },
    { id: "confusing", type: "text", text: "What, if anything, confused you?" },
    { id: "missing", type: "text", text: "What would make you actually use this?" }
  ]
};

/* ---------- Sample profiles (synthetic) ---------- */

/* ---------- Storage ---------- */
const LS = { cfg: "scl.config.v1", sessions: "scl.sessions.v1", counter: "scl.counter.v1" };
function lsGet(k, fallback){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

let config = normalizeConfig(lsGet(LS.cfg, null) || deepClone(DEFAULT_CONFIG));
let sessions = lsGet(LS.sessions, []);
if (!Array.isArray(sessions)) sessions = [];

function normalizeConfig(c){
  const d = deepClone(DEFAULT_CONFIG);
  const out = Object.assign({}, d, c || {});
  out.concept = Object.assign({}, d.concept, (c && c.concept) || {});
  out.session = Object.assign({}, d.session, (c && c.session) || {});
  if (!Array.isArray(out.variants) || !out.variants.length) out.variants = d.variants;
  if (!Array.isArray(out.survey)) out.survey = d.survey;
  if (!Array.isArray(out.concept.pitch)) out.concept.pitch = d.concept.pitch;
  return out;
}

/* ---------- Utilities ---------- */
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  for (const c of children.flat()) { if (c === null || c === undefined || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
function median(a){ if (!a.length) return 0; const s = a.slice().sort((x,y)=>x-y); const m = Math.floor(s.length/2); return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; }
function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function pct(n, d){ return d ? Math.round(100*n/d) : 0; }
function fmtMs(ms){ return ms >= 10000 ? (ms/1000).toFixed(0)+"s" : (ms/1000).toFixed(1)+"s"; }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function syncScore(p){ let overlap = 0, total = 0; for (let i=0;i<7;i++){ overlap += Math.min(p.week[i], TESTER_WEEK[i]); total += Math.max(p.week[i], TESTER_WEEK[i]); } return total ? Math.round(100*overlap/total) : 0; }
function bestSlot(p){ let best = -1, bi = 0; for (let i=0;i<7;i++){ const v = Math.min(p.week[i], TESTER_WEEK[i]); if (v > best) { best = v; bi = i; } } const names = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]; return { day: names[bi], part: p.week[bi] >= 3 ? "afternoon" : "evening" }; }
function grad(hue){ return `linear-gradient(160deg, hsl(${hue} 62% 72%) 0%, hsl(${(hue+35)%360} 58% 48%) 60%, hsl(${(hue+60)%360} 55% 32%) 100%)`; }
function shuffle(a){ const s = a.slice(); for (let i = s.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [s[i],s[j]] = [s[j],s[i]]; } return s; }
function variantById(id){ return config.variants.find(v => v.id === id) || config.variants[0]; }
function nps(scores){ if (!scores.length) return null; const p = scores.filter(s=>s>=9).length, d = scores.filter(s=>s<=6).length; return Math.round(100*(p-d)/scores.length); }
function persistSessions(){ if (!lsSet(LS.sessions, sessions)) toast("Couldn't save to this browser's storage"); }
function copyText(text, label){
  const done = () => toast((label || "Copied") + " to clipboard");
  const fail = () => { const ta = el("textarea", {style:"position:fixed;left:-9999px"}); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); done(); } catch(e){ toast("Copy failed. Select the text manually."); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail();
}
function download(filename, text, type){
  try { const blob = new Blob([text], {type: type || "application/json"}); const a = el("a", {href: URL.createObjectURL(blob), download: filename}); document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch(e){ copyText(text, "Download blocked. Copied"); }
}

/* ---------- Router ---------- */
function setTab(t){ tab = t; for (const b of tabbar.querySelectorAll("button")) b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"); render(); }
tabbar.addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; if (session && b.dataset.tab !== "home") { if (!confirmEnd) return; } setTab(b.dataset.tab); });
let confirmEnd = true;

function render(){
  stage.innerHTML = ""; topRight.innerHTML = "";
  stage.classList.remove("locked");
  document.getElementById("brandName").textContent = config.concept.name || "Concept";
  tabbar.hidden = !!session;
  if (session) {
    topRight.append(el("button", {class:"btn ghost small", onclick: () => abandonSession()}, "End session"));
    if (session.stage === "pitch") renderPitch();
    else if (session.stage === "deck") renderDeck();
    else if (session.stage === "match") renderMatch();
    else if (session.stage === "survey") renderSurvey();
    else if (session.stage === "done") renderDone();
    return;
  }
  if (tab === "home") renderHome();
  else if (tab === "results") renderResults();
  else if (tab === "setup") renderSetup();
  stage.scrollTop = 0;
}

/* ---------- Home ---------- */
let homeTester = "", homeVariant = "auto";

  const seg = el("div", {class:"seg", role:"group", "aria-label":"Variant"});
  const opts = [["auto","Auto-assign"]].concat(config.variants.map(v => [v.id, v.id + " · " + v.label]));

function stat(v, k){ return el("div", {class:"stat"}, el("span", {class:"v num"}, v), el("span", {class:"k"}, k)); }
function npsText(list){ const scores = list.map(s => s.survey && s.survey.nps).filter(v => typeof v === "number"); const n = nps(scores); return n === null ? "–" : (n > 0 ? "+" : "") + n; }
function variantSummary(v){ const bits = []; bits.push(v.cardStyle === "prompt-first" ? "Prompt shown before the photo" : "Photo-first cards"); bits.push(v.showSyncScore ? "Sync score visible" : "No Sync score"); bits.push(v.openerStyle === "plan" ? "Suggested plan on match" : "Blank message box on match"); return bits.join(" · "); }

/* ---------- Session lifecycle ---------- */
function pickVariant(){
  if (homeVariant !== "auto") return homeVariant;
  const mode = config.session.assignVariant;
  if (mode === "random") return config.variants[Math.floor(Math.random()*config.variants.length)].id;
  const counter = lsGet(LS.counter, 0); lsSet(LS.counter, counter + 1);
  return config.variants[counter % config.variants.length].id;
}
function startSession(){
  const variantId = pickVariant();
  session = { id: "s" + Date.now().toString(36), tester: (homeTester || "").trim() || "Anonymous", variantId, startedAt: new Date().toISOString(), stage: "pitch", pitchMs: 0, decisions: [], matches: [], survey: null, events: [] };
  session._pitchStart = performance.now(); session._pitchIndex = 0;
  deck = null; pendingMatch = null;
  logEvent("session_start", { variantId });
  render();
}
function logEvent(type, data){ if (!session) return; session.events.push({ t: Date.now(), type, data: data || {} }); }
function abandonSession(){
  const box = el("div", {class:"confirm"},
    el("b", null, "End this session?"),
    el("p", {class:"muted", style:"font-size:.85rem"}, session.decisions.length ? `${session.decisions.length} decisions so far will be saved as an incomplete session.` : "Nothing has been recorded yet, so nothing will be saved."),
    el("div", {class:"row"},
      el("button", {class:"btn small danger", onclick: () => { finishSession(false); }}, "End session"),
      el("button", {class:"btn small ghost", onclick: () => box.remove()}, "Keep going")));
  stage.prepend(box);
}
function finishSession(completed){
  if (session) {
    session.endedAt = new Date().toISOString(); session.completed = !!completed;
    delete session._pitchStart; delete session._pitchIndex;
    if (session.decisions.length || completed) { sessions.push(session); persistSessions(); }
  }
  session = null; deck = null; pendingMatch = null; homeTester = "";
  setTab(completed ? "home" : "home");
}

/* ---------- Pitch ---------- */
function renderPitch(){
  const slides = config.concept.pitch; const i = session._pitchIndex;
  const sl = slides[i];
  const s = el("section", {class:"screen"});
  const dots = el("div", {class:"dots"}, slides.map((_, k) => el("i", {class: k === i ? "on" : ""})));
  s.append(el("div", {class:"pitch"},
    el("span", {class:"eyebrow"}, config.concept.name),
    el("div", {class:"slide"}, el("h2", null, sl.title), el("p", null, sl.body)),
    dots,
    el("div", {class:"row"},
      el("button", {class:"btn primary", onclick: () => { logEvent("pitch_next", {index:i}); if (i + 1 < slides.length) { session._pitchIndex++; render(); } else beginDeck(); }}, i + 1 < slides.length ? "Next" : "Start swiping"),
      i === 0 ? el("button", {class:"btn ghost", onclick: () => { logEvent("pitch_skipped", {index:i}); beginDeck(); }}, "Skip") : null)));
  stage.append(s);
}
function beginDeck(){
  session.pitchMs = Math.round(performance.now() - session._pitchStart);
  const n = Math.max(1, Math.min(PROFILES.length, config.session.cardsPerSession|0 || 10));
  deck = { profiles: shuffle(PROFILES).slice(0, n), index: 0, cardStart: performance.now(), expanded: false, revealed: false, featureTaps: 0 };
  session.stage = "deck"; render();
}

/* ---------- Deck ---------- */
function renderDeck(){
  stage.classList.add("locked");
  const v = variantById(session.variantId);
  const s = el("section", {class:"screen deckwrap"});
  const done = deck.index, total = deck.profiles.length;
  s.append(el("div", {class:"row between"}, el("span", {class:"eyebrow num"}, `Profile ${Math.min(done+1,total)} of ${total}`), el("span", {class:"chip accent"}, "Variant " + v.id)));
  s.append(el("div", {class:"progress"}, el("i", {style:`width:${pct(done,total)}%`})));
  const deckEl = el("div", {class:"deck", id:"deck"});
  for (let k = Math.min(deck.index + 2, total - 1); k >= deck.index; k--) {
    const card = buildCard(deck.profiles[k], v, k === deck.index);
    if (k === deck.index + 1) card.classList.add("under"); if (k === deck.index + 2) card.classList.add("under2");
    deckEl.append(card);
  }
  s.append(deckEl);
  s.append(el("div", {class:"actions"},
    el("button", {class:"pass", "aria-label":"Pass", onclick: () => decide("pass", true)}, svg("M6 6l12 12M18 6L6 18")),
    el("button", {class:"info", "aria-label":"More about this profile", onclick: toggleExpand}, svg("M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z")),
    el("button", {class:"like", "aria-label":"Like", onclick: () => decide("like", true)}, svg("M12 21s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.2 12C19 16.4 12 21 12 21z"))));
  stage.append(s);
  attachSwipe(deckEl.querySelector(".pcard.top"));
}
function svg(d){ const n = document.createElementNS("http://www.w3.org/2000/svg","svg"); n.setAttribute("viewBox","0 0 24 24"); const p = document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d", d); n.append(p); return n; }

function buildCard(p, v, top){
  const promptFirst = v.cardStyle === "prompt-first";
  const card = el("article", {class:"pcard" + (top ? " top" : "") + (promptFirst ? " prompt-first" : ""), "data-id": p.id});
  const photo = el("div", {class:"photo" + (promptFirst && !(top && deck.revealed) ? " hidden-photo" : ""), style:`background:${grad(p.hue)}`});
  photo.append(el("span", {class:"initial", "aria-hidden":"true"}, p.name[0]), el("i", {class:"glow"}), el("i", {class:"shade"}));
  if (promptFirst) {
    const lead = el("div", {class:"lead"},
      el("span", {class:"q"}, p.prompts[0].q),
      el("span", {class:"a"}, p.prompts[0].a),
      el("div", {class:"row between", style:"margin-top:6px"},
        el("h2", null, p.name + ", " + p.age),
        (top && deck.revealed) ? null : el("button", {class:"reveal", onclick: e => { e.stopPropagation(); deck.revealed = true; deck.featureTaps++; logEvent("photo_revealed", {profileId:p.id}); render(); }}, "Reveal photo")));
    photo.append(lead);
  } else {
    photo.append(el("div", {class:"meta"},
      el("h2", null, p.name + ", " + p.age),
      el("div", {class:"line"}, el("span", null, p.job), el("span", null, p.dist + " away"))));
  }
  photo.append(el("span", {class:"stamp like"}, "Like"), el("span", {class:"stamp pass"}, "Pass"));
  card.append(photo);
  const body = el("div", {class:"pbody"});
  if (v.showSyncScore) {
    const sc = syncScore(p);
    body.append(el("button", {class:"sync", onclick: e => { e.stopPropagation(); deck.featureTaps++; logEvent("sync_tapped", {profileId:p.id, score:sc}); toast(`Overlap is highest on ${bestSlot(p).day} ${bestSlot(p).part}`); }},
      el("span", {class:"pct"}, sc + "%"),
      el("span", {class:"lbl"}, "in sync", el("br"), "with your week"),
      el("span", {class:"week", "aria-label":"Free time by weekday"}, p.week.map((w, i) => { const mine = TESTER_WEEK[i]; const both = Math.min(w, mine); return el("i", {class: both >= 2 ? "m" : both === 1 ? "h" : "", style:`height:${6 + w*6}px`, title: DAYS[i]}); }))));
  }
  if (!promptFirst) body.append(el("div", {class:"prompt"}, el("span", {class:"q"}, p.prompts[0].q), el("span", {class:"a"}, p.prompts[0].a)));
  if (top && deck.expanded) {
    body.append(el("div", {class:"details"},
      el("div", {class:"prompt"}, el("span", {class:"q"}, p.prompts[1].q), el("span", {class:"a"}, p.prompts[1].a)),
      promptFirst ? el("p", {class:"muted", style:"font-size:.85rem"}, p.job + " · " + p.dist + " away") : null,
      el("div", {class:"tags"}, p.interests.map(t => el("span", {class:"chip"}, t)))));
  }
  card.append(body);
  return card;
}
function toggleExpand(){ deck.expanded = !deck.expanded; if (deck.expanded) logEvent("profile_expanded", {profileId: deck.profiles[deck.index].id}); render(); }

function attachSwipe(card){
  if (!card) return;
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, pid = null;
  const likeStamp = card.querySelector(".stamp.like"), passStamp = card.querySelector(".stamp.pass");
  const W = () => card.offsetWidth || 300;
  card.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragging = true; pid = e.pointerId; startX = e.clientX; startY = e.clientY; dx = dy = 0;
    card.classList.remove("snap"); card.setPointerCapture(pid);
  });
  card.addEventListener("pointermove", e => {
    if (!dragging || e.pointerId !== pid) return;
    dx = e.clientX - startX; dy = e.clientY - startY;
    const rot = dx / W() * 18;
    card.style.transform = `translate(${dx}px, ${dy*0.4}px) rotate(${rot}deg)`;
    const k = Math.min(1, Math.abs(dx) / (W()*0.35));
    likeStamp.style.opacity = dx > 0 ? k : 0; passStamp.style.opacity = dx < 0 ? k : 0;
  });
  const end = e => {
    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    const thresh = W() * 0.3;
    if (dx > thresh) decide("like", false, dx, dy);
    else if (dx < -thresh) decide("pass", false, dx, dy);
    else { card.classList.add("snap"); card.style.transform = ""; likeStamp.style.opacity = 0; passStamp.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

let deciding = false;
function decide(choice, viaButton, dx, dy){
  if (deciding || !deck) return; deciding = true;
  const p = deck.profiles[deck.index];
  const ms = Math.round(performance.now() - deck.cardStart);
  session.decisions.push({ profileId: p.id, name: p.name, choice, ms, expanded: deck.expanded, revealed: deck.revealed, featureTaps: deck.featureTaps, viaButton: !!viaButton, syncScore: syncScore(p) });
  logEvent("decision", { profileId: p.id, choice, ms });
  const card = stage.querySelector(".pcard.top");
  if (card) {
    const W = card.offsetWidth || 300; const dir = choice === "like" ? 1 : -1;
    card.classList.remove("snap"); card.classList.add("flying");
    card.style.transform = `translate(${dir * (W*1.5)}px, ${(dy||0)*0.4 + 40}px) rotate(${dir*24}deg)`; card.style.opacity = "0";
    const st = card.querySelector(".stamp." + choice); if (st) st.style.opacity = "1";
  }
  const matched = choice === "like" && Math.random() < (Number(config.session.matchChance) || 0);
  setTimeout(() => {
    deciding = false;

/* ---------- Match ---------- */
function renderMatch(){

/* ---------- Survey ---------- */
function renderSurvey(){

/* ---------- Done ---------- */

/* ---------- Results ---------- */
let resultFilter = "all";

function tile(v, k, sub){ return el("div", {class:"tile"}, el("span", {class:"v num"}, v), el("span", {class:"k"}, k), sub ? el("span", {class:"k num"}, sub) : null); }

/* ---------- Setup ---------- */
function renderSetup(){

      el("button", {class:"btn small", onclick: () => copyText(ta.value, "Configuration copied")}, "Copy"),

  const danger = el("button", {class:"btn ghost small danger", onclick: () => {
    const c = el("div", {class:"confirm"}, el("span", null, `Delete all ${sessions.length} sessions from this phone? Export first if you need them.`), el("div", {class:"row"}, el("button", {class:"btn small danger", onclick: () => { sessions = []; persistSessions(); toast("All sessions deleted"); render(); }}, "Delete everything"), el("button", {class:"btn small ghost", onclick: () => c.replaceWith(danger)}, "Cancel")));
