<style>
/* Built on the Spades Design System (Figma: Qrx7kdcMXnddTjPytlIF9x).
   Tokens below mirror Spades variables: Color (SDS Light / SDS Dark), Size (Space, Radius, Depth), Typography.
   Layout: one-screen phone app. Slim header, scrolling stage, bottom tab bar. The Feed Card deck is the hero. */
:root{
  /* Color / Background */
  --bg:#f7f6f3; --bg-hover:#f5f5f5; --bg-2:#f5f5f5; --bg-3:#d9d9d9;
  /* Color / Text + Icon */
  --fg:#1e1e1e; --fg-2:#757575; --fg-3:#b3b3b3;
  /* Color / Border */
  --border:#d9d9d9; --border-2:#757575;
  /* Color / Brand */
  --brand:#2c2c2c; --brand-hover:#1e1e1e; --on-brand:#f5f5f5; --brand-2:#e6e6e6; --brand-3:#f5f5f5; --text-brand:#2c2c2c;
  /* Color / Positive, Danger, Warning */
  --pos:#028c43; --pos-bg:#1fce71; --pos-2:#cff7d3; --pos-3:#ebffee;
  --danger:#900b09; --danger-bg:#ec221f; --danger-2:#fdd3d0; --danger-3:#fee9e7;
  --warn:#522504; --warn-bg:#e8b931; --warn-2:#fff1c2;
  /* Color / Utilities + Special accents */
  --overlay:rgba(0,0,0,.5); --scrim:rgba(255,255,255,.8); --on-photo:#f3f3f3;
  --accent-green:#b0f48b; --accent-blue:#b3e7ff; --accent-yellow:#fffd70; --accent-purple:#f1a2ff; --accent-teal:#a2ffeb; --accent-chrome:#eaf5ff;
  /* Size / Space */
  --sp-100:4px; --sp-150:6px; --sp-200:8px; --sp-300:12px; --sp-400:16px; --sp-600:24px; --sp-800:32px; --sp-1200:48px;
  /* Size / Radius */
  --r-100:4px; --r-200:8px; --r-400:16px; --r-600:24px; --r-800:32px; --r-full:9999px;
  /* Effects / Drop Shadow */
  --shadow-100:0 1px 4px rgba(12,12,13,.05);
  --shadow-200:0 1px 4px rgba(12,12,13,.05),0 1px 4px rgba(12,12,13,.1);
  --shadow-400:0 4px 4px rgba(12,12,13,.05),0 16px 32px rgba(12,12,13,.1);
  /* Typography */
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-hero:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1e1e; --bg-hover:#383838; --bg-2:#2c2c2c; --bg-3:#444444;
  --fg:#f7f6f3; --fg-2:rgba(247,246,243,.7); --fg-3:rgba(247,246,243,.4);
  --border:#444444; --border-2:#757575;
  --brand:#f5f5f5; --brand-hover:#d9d9d9; --on-brand:#1e1e1e; --brand-2:#444444; --brand-3:#444444; --text-brand:#f5f5f5;
  --pos:#cff7d3; --pos-bg:#06a24f; --pos-2:#028c43; --pos-3:#015328;
  --danger:#fdd3d0; --danger-bg:#c00f0c; --danger-2:#690807; --danger-3:#4d0b0a;
  --warn:#fff1c2; --warn-bg:#e8b931; --warn-2:#682d03;
  --scrim:rgba(0,0,0,.8);
  --shadow-100:0 1px 4px rgba(0,0,0,.3); --shadow-200:0 1px 4px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.4); --shadow-400:0 4px 4px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.5);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1e1e1e; --bg-hover:#383838; --bg-2:#2c2c2c; --bg-3:#444444;
  --fg:#f7f6f3; --fg-2:rgba(247,246,243,.7); --fg-3:rgba(247,246,243,.4);
  --border:#444444; --border-2:#757575;
  --brand:#f5f5f5; --brand-hover:#d9d9d9; --on-brand:#1e1e1e; --brand-2:#444444; --brand-3:#444444; --text-brand:#f5f5f5;
  --pos:#cff7d3; --pos-bg:#06a24f; --pos-2:#028c43; --pos-3:#015328;
  --danger:#fdd3d0; --danger-bg:#c00f0c; --danger-2:#690807; --danger-3:#4d0b0a;
  --warn:#fff1c2; --warn-bg:#e8b931; --warn-2:#682d03;
  --scrim:rgba(0,0,0,.8);
  --shadow-100:0 1px 4px rgba(0,0,0,.3); --shadow-200:0 1px 4px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.4); --shadow-400:0 4px 4px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
p{margin:0}
/* Spades text styles */
.t-hero{font-family:var(--font-hero);font-weight:700;font-size:48px;line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.t-title{font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.t-heading{font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.t-subheading{font-weight:400;font-size:16px;line-height:1.2}
.t-body{font-size:14px;line-height:1.4}
.t-strong{font-size:14px;font-weight:600;line-height:1.4}
.t-small{font-size:13px;line-height:1.4}
.t-xs{font-size:12px;line-height:1.4}
.t-caption{font-family:var(--font-mono);font-size:12px;line-height:1.1;letter-spacing:.005em;text-transform:uppercase}
.muted{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* App frame */
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-300);padding-block:var(--sp-300);padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:var(--sp-200)}
.brand .name{font-family:var(--font-hero);font-weight:700;font-size:20px;letter-spacing:-.03em;line-height:1}
.brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}
.topbar .right{display:flex;align-items:center;gap:var(--sp-200)}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:var(--sp-200) var(--sp-600);-webkit-overflow-scrolling:touch}
.stage.locked{overflow:hidden}
.screen{display:flex;flex-direction:column;gap:var(--sp-400);min-height:100%}
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--bg);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-100);padding:var(--sp-200) var(--sp-100) var(--sp-150);font-size:12px;color:var(--fg-2)}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--fg);font-weight:600}

/* Spades Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-200);padding:var(--sp-300);border-radius:var(--r-600);border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:14px;line-height:1;min-height:40px;transition:background .15s ease,transform .08s ease}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.subtle{background:transparent;border-color:transparent;color:var(--fg)}
.btn.subtle:hover{background:var(--bg-2)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-bg);color:#fee9e7}
.btn.danger.subtle{background:transparent;border-color:transparent;color:var(--danger)}
.btn.small{padding:var(--sp-200) var(--sp-300);min-height:32px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{background:var(--bg-3);border-color:var(--bg-3);color:var(--fg-3);cursor:default;transform:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.iconbtn.lg{width:56px;height:56px}
.iconbtn.lg svg{width:24px;height:24px}

/* Spades Input Field, Select, Textarea */
.field{display:flex;flex-direction:column;gap:var(--sp-200)}
.field label{font-size:14px;line-height:1.4}
.field .hint{font-size:14px;color:var(--fg-2)}
input[type=text],input[type=number],textarea,select{width:100%;min-width:0;padding:var(--sp-300) var(--sp-400);border:1px solid var(--border);border-radius:var(--r-200);background:var(--bg);color:var(--fg);line-height:1}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
textarea{min-height:88px;resize:vertical;line-height:1.4}
textarea.code{font-family:var(--font-mono);font-size:12px;line-height:1.5;min-height:320px;white-space:pre;overflow:auto}

/* Spades Tag + Tag Toggle */
.tag{display:inline-flex;align-items:center;gap:var(--sp-200);padding:var(--sp-200);border-radius:var(--r-200);background:var(--brand-2);color:var(--text-brand);font-size:14px;line-height:1}
.tag.brand{background:var(--brand);color:var(--on-brand)}
.tag.pos{background:var(--pos-2);color:var(--pos)}
.tag.danger{background:var(--danger-2);color:var(--danger)}
.tag.neutral{background:var(--bg-2);color:var(--fg-2)}
.toggles{display:flex;gap:var(--sp-200);flex-wrap:wrap}
.toggles button{padding:var(--sp-200) var(--sp-300);border-radius:var(--r-200);border:1px solid var(--border);background:var(--bg);font-size:14px;line-height:1}
.toggles button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Spades Card + Stats Card */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-200);padding:var(--sp-600);display:flex;flex-direction:column;gap:var(--sp-400);min-width:0}
.card.tight{padding:var(--sp-400);gap:var(--sp-300)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-200)}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-200);padding:var(--sp-400);display:flex;flex-direction:column;gap:var(--sp-100);align-items:center;text-align:center;min-width:0}
.stat .v{font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.stat .k{font-size:13px;color:var(--fg-2)}
.row{display:flex;gap:var(--sp-200);align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--sp-300)}
.notice{background:var(--bg-2);border-radius:var(--r-200);padding:var(--sp-300) var(--sp-400);font-size:14px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--brand);color:var(--on-brand);padding:var(--sp-300) var(--sp-400);border-radius:var(--r-full);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow-400)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{display:flex;flex-direction:column;gap:var(--sp-300);background:var(--bg-2);border-radius:var(--r-200);padding:var(--sp-400)}

/* Home */
.hero{padding-block:var(--sp-600) var(--sp-200);display:flex;flex-direction:column;gap:var(--sp-300)}
.hero .tag-line{font-size:16px;line-height:1.3;color:var(--fg-2);max-width:30ch}

/* Pitch */
.pitch{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-800);padding-block:var(--sp-600)}
.pitch .slide{display:flex;flex-direction:column;gap:var(--sp-400)}
.pitch .slide p{font-size:16px;line-height:1.4;color:var(--fg-2);max-width:34ch}
.dots{display:flex;gap:var(--sp-150)}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg-3);display:block}
.dots i.on{background:var(--brand);width:24px;border-radius:4px}

/* People (one full profile at a time) */
.peoplehead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-300)}
.pbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:600;line-height:1}
.tabbar button{position:relative}
.tabbar button .pbadge{position:absolute;top:4px;right:calc(50% - 24px)}
.pheader{position:relative;aspect-ratio:362/360;border-radius:var(--r-800);overflow:hidden;color:var(--on-photo);display:flex;flex-direction:column;background:#1a1a1a}
.pheader .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.pheader .photo .initial{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-hero);font-weight:700;font-size:min(44vw,200px);line-height:1;color:rgba(255,255,255,.14)}
.pheader .top{position:relative;padding:var(--sp-400);display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(180deg,rgba(26,26,26,.4),rgba(26,26,26,0))}
.pheader .bottom{position:relative;margin-top:auto;padding:40px 20px 20px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.75))}
.pheader .bottom .big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.pheader .bottom .big span{font-weight:400}
.pheader .bottom .loc{font-size:14px;display:flex;align-items:center;gap:var(--sp-100);margin-top:4px}
.pheader .bottom .loc svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.ufi{display:flex;gap:var(--sp-200);align-items:center}
.ufi button{width:40px;height:40px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;transition:transform .1s,background .15s}
.ufi button:active{transform:scale(.9)}
.ufi button[aria-pressed="true"]{background:#fff;color:#1e1e1e}
.ufi button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pmods{display:flex;flex-direction:column;gap:var(--sp-300);padding:var(--sp-400) 20px;border-radius:var(--r-800);background:#2c2c2c;color:#f3f3f3}
.bio{font-size:16px;line-height:1.4;padding-inline:4px}
.mod{display:flex;flex-direction:column;gap:var(--sp-200)}
.mod .title{display:flex;align-items:center;gap:var(--sp-150);font-size:14px;line-height:1;height:25px}
.mod .title svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.hscroll::-webkit-scrollbar{display:none}
.art{width:79px;height:80px;border-radius:var(--r-600);flex-shrink:0;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-hero);font-weight:700;font-size:22px;letter-spacing:-.03em;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.art.sq{border-radius:var(--r-400)}
.track{display:flex;align-items:center;gap:var(--sp-300)}
.track .cover{width:48px;height:48px;border-radius:var(--r-full);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-hero);font-weight:700;font-size:18px;color:rgba(255,255,255,.9)}
.track .cover.sq{border-radius:var(--r-400)}
.track .name{font-size:14px;font-weight:600;line-height:1.4}
.track .artist{font-size:14px;line-height:1}
.pill{display:flex;align-items:center;gap:var(--sp-300);padding:var(--sp-200) var(--sp-400);border-radius:var(--r-full);background:var(--overlay)}
.pill .play{margin-left:auto;width:20px;height:20px;flex-shrink:0}
.pill .play svg{width:20px;height:20px;fill:#fff}
.datetile{width:64px;flex-shrink:0;border-radius:var(--r-400);padding:8px 0 4px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28)}
.datetile .m{font-size:14px;line-height:1.4}
.datetile .d{font-weight:700;font-size:40px;line-height:1.2;letter-spacing:-.02em}
.badges{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.badges::-webkit-scrollbar{display:none}
.badge{flex-shrink:0;padding:6px 12px;border-radius:var(--r-full);border:1px solid rgba(255,255,255,.35);font-size:14px;font-weight:600;line-height:1.4;white-space:nowrap;color:#fff;background:rgba(255,255,255,.04)}
.badge.shared{background:linear-gradient(164deg,rgba(223,234,242,.05) 20%,rgba(195,206,215,.5) 75%)}
.badge.shared span{font-weight:400;font-size:13px}
.voice{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-full);background:#f7f6f3;color:#000;box-shadow:-10px -10px 24px rgba(235,253,223,.5),6px 8px 50px rgba(32,106,108,.15),14px 14px 24px rgba(124,221,224,.3),inset -4px -4px 12px rgba(255,255,255,.8),inset 6px 6px 16px rgba(117,203,187,.18);width:max-content;max-width:100%}
.voice .pbtn{width:32px;height:32px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.voice .pbtn svg{width:14px;height:14px;fill:#000}
.voice .wave{display:flex;align-items:center;gap:2px;height:32px;padding-block:8px}
.voice .wave i{display:block;width:2px;min-height:2px;border-radius:80px;background:#2c2c2c}
.voice .dur{font-weight:600;font-size:14px;padding-right:6px}
.shared-count{display:inline-flex;align-items:center;gap:var(--sp-200);padding:var(--sp-200) var(--sp-300);border-radius:var(--r-full);background:var(--brand-3);color:var(--text-brand);font-size:12px;line-height:1.4;height:28px}
.shared-count b{font-weight:700}
.shared-count svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* About section (events, orbit, mutuals) */
.about{display:flex;flex-direction:column;gap:var(--sp-400);padding:var(--sp-400) 20px;border-radius:var(--r-800);background:#2c2c2c;color:#f3f3f3}
.about .facet{display:flex;flex-direction:column;gap:var(--sp-200)}
.about .facet .title{display:flex;align-items:center;gap:var(--sp-150);font-size:14px;line-height:1;height:20px;color:rgba(243,243,243,.85)}
.about .facet .title svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.about .events{display:flex;flex-direction:column;gap:var(--sp-300)}
.about .mutual{display:flex;align-items:center;gap:var(--sp-300)}
.about .mutual .faces{display:flex}
.about .mutual .faces i{width:36px;height:36px;border-radius:var(--r-200);border:2px solid #2c2c2c;display:flex;align-items:center;justify-content:center;font-family:var(--font-hero);font-weight:700;color:rgba(255,255,255,.9);font-size:14px}
.about .mutual .faces i+i{margin-left:-8px}
.about .mutual .names{font-size:14px;line-height:1.4}
.about .mutual .names span{color:rgba(243,243,243,.7)}
/* Profile builds shown in full, with the remix bar from the Figma playlist */
.remixbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-400);padding-top:var(--sp-200)}
.remixbar .hint{font-size:12px;line-height:1.4;color:var(--fg);max-width:18ch}
.remixbtn{display:inline-flex;align-items:center;gap:var(--sp-200);height:34px;padding:0 var(--sp-400);border-radius:18px;background:rgba(0,0,0,.7);color:#f5f5f5;font-size:14px;font-weight:600;border:1px solid #fff;box-shadow:-3px -3px 24px var(--accent-chrome),6px 8px 50px rgba(128,122,158,.15),3px 5px 28px rgba(186,240,178,.2),inset -4px -4px 12px rgba(0,0,0,.7),inset 3px 3px 12px rgba(140,133,178,.08);white-space:nowrap}
.remixbtn:disabled{opacity:.45;box-shadow:none}
.remixbtn svg{width:18px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.buildbox .bhead{display:flex;align-items:center;gap:var(--sp-200)}
.buildbox .bhead svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.buildbox .bhead .kd{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);margin-left:auto}
.sheet.tall{max-height:88%;padding-bottom:0}
.sheet .sfoot{position:sticky;bottom:0;background:var(--bg);padding:var(--sp-300) 0 calc(var(--sp-400) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--sp-200)}
.sheet .plist .pitem{min-height:68px}
/* Inline slot builder: fanned stack (collapsed) → tray of tiles (open) with a finder underneath */
.stack{position:relative;height:156px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stack .tile{position:absolute;left:50%;top:12px;margin-left:-58px;transform:rotate(var(--r)) translateX(var(--x)) translateY(var(--y));transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.stack:hover .tile,.stack:focus-visible .tile{transform:rotate(calc(var(--r) * 1.4)) translateX(calc(var(--x) * 1.25)) translateY(var(--y))}
.stack .hint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:var(--fg-2)}
.tile{width:116px;height:128px;border-radius:20px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow-200);text-align:left;border:0;position:relative;overflow:hidden;flex:0 0 116px;background:var(--bg-3)}
.tile .lab{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.85;line-height:1.2}
.tile .big{font-family:var(--font-hero);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.03em;opacity:.35;position:absolute;right:8px;top:6px}
.tile .val{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile .mk{position:absolute;left:8px;bottom:8px;font-size:10px;padding:3px 7px;border-radius:var(--r-full);background:var(--accent-green);color:#1e1e1e;font-weight:600}
.tile .mk.new{background:var(--accent-yellow)}
.tile .mk.both{background:var(--accent-blue)}
.tile.empty{background:transparent;border:1.5px dashed var(--border-2);color:var(--fg-2);box-shadow:none}
.tile.mine::after{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 2px var(--accent-green);pointer-events:none}
.tray{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 12px;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-4px}
.tray::-webkit-scrollbar{display:none}
.tray .tile{scroll-snap-align:start;cursor:pointer;transition:transform .15s,outline-color .15s;outline:3px solid transparent;outline-offset:2px;animation:fanout .35s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 40ms)}
.tray .tile.sel{outline-color:var(--brand);transform:translateY(-4px)}
.tray .tile.over{outline-color:var(--accent-green);outline-style:dashed;transform:scale(1.04)}
.tray .tile.drop{animation:dropin .4s cubic-bezier(.2,.8,.3,1.2)}
.tray .tile.shake{animation:shake .3s}
.tray .tile:disabled{cursor:default;opacity:.7}
@keyframes fanout{from{transform:translateX(-30px) rotate(-4deg);opacity:.4}to{transform:none;opacity:1}}
@keyframes dropin{0%{transform:scale(1.2) translateY(-6px)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.finder{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-400);background:var(--bg-2)}
.finder .fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg-2)}
.finder .fhead b{color:var(--fg)}
.finder input{background:var(--bg);padding:10px 12px}
.results{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
.results .grp{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);padding-top:4px}
.results .chips{gap:8px}
.chipr{display:inline-flex;align-items:center;gap:7px;padding:7px 10px 7px 7px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-size:13px;line-height:1.2;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%}
.chipr:active{cursor:grabbing}
.chipr .sw{width:20px;height:20px;border-radius:6px;flex-shrink:0}
.chipr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipr.undo{background:var(--accent-yellow);color:#1e1e1e;border-color:transparent}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;transform:translate(-50%,-50%) scale(1.06) rotate(-2deg);box-shadow:var(--shadow-400);opacity:.96}
.trayfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
/* Starter builds on a profile */
.starters{display:flex;flex-direction:column;gap:var(--sp-300)}
.starter{border:1px solid var(--border);border-radius:var(--r-600);padding:var(--sp-400);display:flex;flex-direction:column;gap:var(--sp-300);background:var(--bg);box-shadow:var(--shadow-100)}
.starter .head{display:flex;align-items:center;gap:var(--sp-200)}
.starter .head svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.starter .head .nm{font-size:16px;font-weight:600;line-height:1.2}
.starter .head .kd{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);margin-left:auto}
.starter .preview{display:flex;gap:var(--sp-200);flex-wrap:wrap}
.starter .preview .cv{width:44px;height:44px;border-radius:var(--r-200);display:flex;align-items:flex-end;padding:4px;font-family:var(--font-hero);font-weight:700;font-size:13px;color:rgba(255,255,255,.9)}
.slotchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-full);border:1px solid var(--border);font-size:13px;line-height:1.2;background:var(--bg-2)}
.slotchip .k{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2)}
.slotchip.open{border-style:dashed;background:transparent;color:var(--fg-2)}
.starter .cta{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-300)}
.starter .cta .hint{font-size:12px;color:var(--fg-2);max-width:18ch;line-height:1.3}
.starter.locked{opacity:.55}

/* Build editor (list and slots) */
.buildbox{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-800);padding:var(--sp-400) 20px 20px;display:flex;flex-direction:column;gap:var(--sp-300);box-shadow:var(--shadow-200)}
.buildbox .ptitle{font-size:14px;font-weight:600;line-height:1.4;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-300)}
.rules{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);display:flex;gap:var(--sp-300);flex-wrap:wrap}
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 7px;border-bottom:1px solid var(--border);min-height:76px}
.pitem:last-child{border-bottom:0}
.pitem .cover{width:56px;height:56px;border-radius:var(--r-400);flex-shrink:0;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-hero);font-weight:700;font-size:18px;color:rgba(255,255,255,.9)}
.pitem .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:0 4px}
.pitem .song{font-size:16px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .artist{font-size:14px;line-height:1.4;display:flex;align-items:center;gap:var(--sp-200);flex-wrap:wrap}
.pitem .lab{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2)}
.pitem.empty .song{color:var(--fg-3);font-weight:400}
.pitem.empty .cover{border:1px dashed var(--border-2);background:transparent;color:var(--fg-3)}
.micro{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-full);border:1px solid var(--border);font-size:12px;line-height:1.4;font-weight:400;background:linear-gradient(153deg,rgba(223,234,242,.005) 20%,rgba(195,206,215,.05) 75%)}
.micro.you{background:var(--accent-green);color:#1e1e1e;border-color:transparent}
.micro.new{background:var(--accent-yellow);color:#1e1e1e;border-color:transparent}
.micro.both{background:var(--accent-blue);color:#1e1e1e;border-color:transparent}
.pitem .act{flex-shrink:0;display:flex;gap:var(--sp-150);align-items:center}
.pitem .playico{width:27px;height:27px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center}
.pitem .playico svg{width:12px;height:12px;fill:var(--on-brand)}
.pitem.added{background:var(--pos-3)}
.pitem.swapped .song s{color:var(--fg-3);font-weight:400;font-size:13px;margin-left:6px}
.addrow{display:flex;align-items:center;justify-content:center;gap:var(--sp-200);padding:var(--sp-300);border:1px dashed var(--border-2);border-radius:var(--r-400);font-size:14px;color:var(--fg);background:transparent;width:100%;margin-top:var(--sp-200)}
.addrow:disabled{opacity:.5}
.addrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sticky-actions{position:sticky;bottom:0;padding:var(--sp-300) 0 var(--sp-200);background:linear-gradient(180deg,transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:var(--sp-200);z-index:4}
.backbar{display:flex;align-items:center;gap:var(--sp-200);min-height:32px}
.backbar .iconbtn{width:32px;height:32px}
.backbar .iconbtn svg{width:18px;height:18px}
.passbar{position:sticky;bottom:0;display:flex;justify-content:center;gap:var(--sp-400);padding:var(--sp-300) 0 var(--sp-200);background:linear-gradient(180deg,transparent,var(--bg) 35%);z-index:4}
.passbar .iconbtn.lg{box-shadow:var(--shadow-200)}
.passbar .lbl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--fg-2)}

/* Bottom sheet (picker) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--bg);color:var(--fg);border-radius:var(--r-800) var(--r-800) 0 0;box-shadow:var(--shadow-400);padding:var(--sp-300) 20px calc(var(--sp-600) + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:var(--sp-300);max-width:520px;margin:0 auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--bg-3);margin:0 auto}
.sheet .pitem{cursor:pointer;min-height:60px;padding-block:8px}
.sheet .pitem .cover{width:40px;height:40px;font-size:13px;border-radius:var(--r-200)}
.sheet .pitem .song{font-size:14px}
.sheet .grp{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);padding-top:var(--sp-200)}

/* Builds inbox + thread + chats */
.mixrow{display:flex;align-items:center;gap:var(--sp-300);padding:var(--sp-300) 0;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left}
.mixrow:last-child{border-bottom:0}
.mixrow .av{width:44px;height:44px;border-radius:var(--r-200);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;position:relative}
.mixrow .av svg{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;padding:4px;border-radius:50%;background:var(--brand);color:var(--on-brand);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mixrow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mixrow .meta .n{font-size:14px;font-weight:600}
.mixrow .meta .st{font-size:13px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0}
.roundchip{display:inline-flex;align-items:center;gap:var(--sp-100);padding:var(--sp-100) var(--sp-200);border-radius:var(--r-full);background:var(--bg-2);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2)}
.statusline{display:flex;align-items:center;gap:var(--sp-200);font-size:14px;color:var(--fg-2);padding:var(--sp-200) 4px}
.statusline i{width:8px;height:8px;border-radius:50%;background:var(--warn-bg);display:inline-block;flex-shrink:0}
.statusline.ready i{background:var(--pos-bg)}
.readybox{display:flex;flex-direction:column;gap:var(--sp-300);padding:var(--sp-400);border-radius:var(--r-400);background:var(--bg-2)}
.readybox .who{display:flex;gap:var(--sp-200);flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:var(--sp-150);font-size:13px;color:var(--fg-2)}
.chk i{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center}
.chk.on{color:var(--fg)}
.chk.on i{background:var(--brand);border-color:var(--brand)}
.chk svg{width:10px;height:10px;stroke:var(--on-brand);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mixtape{display:flex;flex-direction:column;align-items:center;gap:var(--sp-600);text-align:center;padding-block:var(--sp-600)}
.cover-grid{width:180px;height:180px;border-radius:var(--r-800);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow-400);transform:rotate(-3deg)}
.cover-grid i{display:block}
.chat{display:flex;flex-direction:column;gap:var(--sp-300);text-align:left;width:100%}
.bubble{align-self:flex-end;background:var(--brand);color:var(--on-brand);padding:var(--sp-200) var(--sp-300);border-radius:var(--r-400) var(--r-400) 4px var(--r-400);font-size:14px;max-width:85%}
.bubble.them{align-self:flex-start;background:var(--bg-2);color:var(--fg);border-radius:var(--r-400) var(--r-400) var(--r-400) 4px}
.locked{display:flex;align-items:center;gap:var(--sp-200);justify-content:center;padding:var(--sp-300);border-radius:var(--r-400);border:1px dashed var(--border-2);color:var(--fg-2);font-size:13px}
.locked svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Survey */
.q{display:flex;flex-direction:column;gap:var(--sp-300)}
.q .text{font-size:14px;line-height:1.4}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-150)}
.likert button,.npsrow button{padding:var(--sp-300) 0;border-radius:var(--r-200);border:1px solid var(--border);background:var(--bg);font-size:14px;line-height:1}
.likert button[aria-pressed="true"],.npsrow button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.likert .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2)}
.npsrow{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.npsrow button{padding:var(--sp-200) 0;font-size:12px;border-radius:var(--r-100)}

/* Results */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:var(--sp-200) var(--sp-150);border-bottom:1px solid var(--border);vertical-align:top}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:var(--sp-200)}
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) 2fr auto;gap:var(--sp-300);align-items:center;font-size:13px}
.bar .trk{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;display:block}
.bar .fill{height:100%;background:var(--brand);border-radius:4px;display:block}
.bar .fill.pos{background:var(--pos-bg)}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar .val{font-variant-numeric:tabular-nums;color:var(--fg-2);min-width:4ch;text-align:right}
.funnel{display:flex;flex-direction:column;gap:var(--sp-150)}
.funnel .step{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:var(--sp-300);align-items:center;font-size:13px}
.funnel .step .trk{height:22px;background:var(--bg-2);border-radius:var(--r-100);overflow:hidden;display:block}
.funnel .step .fill{height:100%;background:var(--brand);display:block}
.funnel .step .val{font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
.sess{display:flex;flex-direction:column;gap:var(--sp-200)}
.sess details{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-200);padding:var(--sp-400)}
.sess summary{cursor:pointer;display:flex;justify-content:space-between;gap:var(--sp-300);align-items:center;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess .body{display:flex;flex-direction:column;gap:var(--sp-200);padding-top:var(--sp-300);font-size:13px}
.quote{border-left:2px solid var(--border);padding-left:var(--sp-300);color:var(--fg-2)}
.empty{text-align:center;color:var(--fg-2);padding:var(--sp-800) var(--sp-300);display:flex;flex-direction:column;gap:var(--sp-200);align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-150)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  for (const c of children.flat()) { if (c === null || c === undefined || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
